name: D.E.U.S. CI

on:
  push:
    branches:
      - feat/claude-vercel-proxy
  pull_request:
    branches:
      - main
      - feat/claude-vercel-proxy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Expo app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Deus
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Deus/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Export Android bundle
        run: npx expo export --platform android

      - name: Export Web bundle
        run: npx expo export --platform web
